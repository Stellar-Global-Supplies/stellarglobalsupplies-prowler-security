name: Prowler Security Scan

on:
  schedule:
    - cron: '0 * * * *'   # Every hour — free because repo is public
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  scan-aws:
    name: Scan AWS
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Prowler
        run: pip install prowler --quiet

      - name: Run Prowler on AWS
        run: |
          prowler aws \
            --output-formats json-results \
            --output-directory ./output \
            --output-filename aws-findings \
            --ignore-exit-code-3
        continue-on-error: true

      - name: Push AWS findings to D1
        if: always()
        env:
          INGEST_URL: ${{ secrets.CF_WORKER_INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.CF_WORKER_INGEST_TOKEN }}
        run: |
          python3 scripts/parse_and_push.py \
            --file ./output/aws-findings.results.json \
            --provider aws \
            --url "$INGEST_URL" \
            --token "$INGEST_TOKEN"

  scan-cloudflare:
    name: Scan Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Prowler
        run: pip install prowler --quiet

      - name: Run Prowler on Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          prowler cloudflare \
            --output-formats json-results \
            --output-directory ./output \
            --output-filename cf-findings \
            --ignore-exit-code-3
        continue-on-error: true
      
      - name: Test Worker with curl
        run: |
          curl -v \
            -X POST \
            "${{ secrets.CF_WORKER_INGEST_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CF_WORKER_INGEST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHubActions" \
            -d '{}'

      - name: Push Cloudflare findings to D1
        if: always()
        env:
          INGEST_URL: ${{ secrets.CF_WORKER_INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.CF_WORKER_INGEST_TOKEN }}
        run: |
          python3 scripts/parse_and_push.py \
            --file ./output/cf-findings.results.json \
            --provider cloudflare \
            --url "$INGEST_URL" \
            --token "$INGEST_TOKEN"

name: Prowler Security Scan

on:
  schedule:
    - cron: '0 0,12 * * *'   # Twice daily at 12 AM and 12 PM UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  scan-aws:
    name: Scan AWS
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read
    strategy:
      fail-fast: false  # Continue scanning other services if one fails
      matrix:
        service:
          - iam
          - s3
          - lambda
          - rds
          - cloudwatch
          - cloudwatchlogs
          - stepfunctions
          - cloudfront
          - route53
          - acm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Prowler
        run: pip install prowler --quiet

      - name: Apply json-results patch
        run: python3 prowler_patches/apply_patch.py

      - name: Run Prowler on AWS - ${{ matrix.service }}
        id: prowler_aws
        run: |
          echo "Scanning ${{ matrix.service }}..."
          prowler aws \
            --output-formats json-results \
            --output-directory ./output \
            --output-filename aws-findings-${{ matrix.service }} \
            --service ${{ matrix.service }} \
            --ignore-exit-code-3 2>&1 | tee /tmp/prowler-aws-${{ matrix.service }}.log
          CHECKS=$(grep -oP 'Executing \K[0-9]+(?= checks)' /tmp/prowler-aws-${{ matrix.service }}.log | tail -1 || echo "0")
          echo "checks_executed=${CHECKS}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Push AWS findings to D1 - ${{ matrix.service }}
        if: always()
        env:
          INGEST_URL: ${{ secrets.CF_WORKER_INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.CF_WORKER_INGEST_TOKEN }}
        run: |
          if [ -f ./output/aws-findings-${{ matrix.service }}.results.json ]; then
            python3 scripts/parse_and_push.py \
              --file ./output/aws-findings-${{ matrix.service }}.results.json \
              --provider aws \
              --checks-executed "${{ steps.prowler_aws.outputs.checks_executed }}" \
              --url "$INGEST_URL" \
              --token "$INGEST_TOKEN"
          else
            echo "No results file found for ${{ matrix.service }}"
          fi

  scan-neon:
    name: Scan NeonDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run NeonDB Security Scan
        id: neon_scan
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          python3 scripts/scan_neon.py 2>&1 | tee /tmp/neon-scan.log
        continue-on-error: true

      - name: Push NeonDB findings to D1
        if: always()
        env:
          INGEST_URL: ${{ secrets.CF_WORKER_INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.CF_WORKER_INGEST_TOKEN }}
        run: |
          if [ -f ./output/neon-findings.results.json ]; then
            python3 scripts/parse_and_push.py \
              --file ./output/neon-findings.results.json \
              --provider neon \
              --url "$INGEST_URL" \
              --token "$INGEST_TOKEN"
          else
            echo "No NeonDB results file found"
          fi

  scan-supabase:
    name: Scan Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Supabase Security Scan
        id: supabase_scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          python3 scripts/scan_supabase.py 2>&1 | tee /tmp/supabase-scan.log
        continue-on-error: true

      - name: Push Supabase findings to D1
        if: always()
        env:
          INGEST_URL: ${{ secrets.CF_WORKER_INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.CF_WORKER_INGEST_TOKEN }}
        run: |
          if [ -f ./output/supabase-findings.results.json ]; then
            python3 scripts/parse_and_push.py \
              --file ./output/supabase-findings.results.json \
              --provider supabase \
              --url "$INGEST_URL" \
              --token "$INGEST_TOKEN"
          else
            echo "No Supabase results file found"
          fi

  scan-cloudflare:
    name: Scan Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Prowler
        run: pip install prowler --quiet

      - name: Apply json-results patch
        run: python3 prowler_patches/apply_patch.py

      - name: Run Prowler on Cloudflare
        id: prowler_cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          prowler cloudflare \
            --output-formats json-results \
            --output-directory ./output \
            --output-filename cf-findings \
            --ignore-exit-code-3 2>&1 | tee /tmp/prowler-cf.log
          CHECKS=$(grep -oP 'Executing \K[0-9]+(?= checks)' /tmp/prowler-cf.log | tail -1 || echo "0")
          echo "checks_executed=${CHECKS}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Push Cloudflare findings to D1
        if: always()
        env:
          INGEST_URL: ${{ secrets.CF_WORKER_INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.CF_WORKER_INGEST_TOKEN }}
        run: |
          python3 scripts/parse_and_push.py \
            --file ./output/cf-findings.results.json \
            --provider cloudflare \
            --checks-executed "${{ steps.prowler_cf.outputs.checks_executed }}" \
            --url "$INGEST_URL" \
            --token "$INGEST_TOKEN"
name = "prowler-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "prowler-db"
database_id = "YOUR_D1_DATABASE_ID"   # replace after: wrangler d1 create prowler-db

[vars]
ENVIRONMENT = "production"

# Set via: wrangler secret put INGEST_TOKEN
# INGEST_TOKEN = "your-secret-token-here"

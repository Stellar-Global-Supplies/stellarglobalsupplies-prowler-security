name = "prowler-api"
main = "src/index.ts"
compatibility_date = "2026-08-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "prowler-db"
database_id = "YOUR_D1_DATABASE_ID"   # replace after: wrangler d1 create prowler-db

[vars]
ENVIRONMENT = "production"

[[secrets_store_secrets]]
binding = "INGEST_TOKEN"
store_id = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "CF_API_TOKEN"

[observability]
enabled = true
head_sampling_rate = 1